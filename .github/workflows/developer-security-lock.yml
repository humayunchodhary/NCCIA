name: Developer Security & Code Authorization Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-authorization:
    name: Verify Authorized Developer
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Committer Identity
        run: |
          SENDER="${{ github.actor }}"
          COMMIT_EMAIL="${{ github.event.head_commit.author.email }}"
          echo "Triggered by GitHub Actor: $SENDER"
          echo "Commit Author Email: $COMMIT_EMAIL"

          # Whitelist: livesoftix (owner) / Humayun (nccia@real-erp.net)
          if [ "$SENDER" = "livesoftix" ] || [ "$COMMIT_EMAIL" = "nccia@real-erp.net" ] || [ "$SENDER" = "github-actions[bot]" ]; then
            echo "✅ Verified: Authorized Developer (Engr. Humayun / LiveSoftix)"
            exit 0
          else
            echo "=========================================================================="
            echo "❌ ACCESS VIOLATION: Unauthorized modification attempt!"
            echo "User: '$SENDER' | Email: '$COMMIT_EMAIL'"
            echo "This codebase is locked and proprietary to Engr. Humayun (LiveSoftix)."
            echo "No other contributor is permitted to alter this repository."
            echo "=========================================================================="
            exit 1
          fi
