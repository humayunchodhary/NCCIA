name: Build NCCIA Android Mobile App (APK)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-app/**'
      - 'react-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web & Mobile Applications
        working-directory: react-app
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm run build:mobile

      - name: Setup Mobile App & Sync Capacitor
        working-directory: mobile-app
        run: |
          npm install --legacy-peer-deps
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        working-directory: mobile-app/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release Artifact
        run: |
          mkdir -p release-apk
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk release-apk/NCCIA-CMS-v2.4.1.apk
          echo "APK build complete: release-apk/NCCIA-CMS-v2.4.1.apk"

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCCIA-CMS-Mobile-App-v2.4.1
          path: release-apk/NCCIA-CMS-v2.4.1.apk
          retention-days: 30
